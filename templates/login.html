{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Dashboard Data Pasar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background-color: #f7f8fa;
            color: #111827;
            font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 32px 28px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .brand-mark {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #111827;
            margin: 0 0 4px 0;
            letter-spacing: -0.01em;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.875rem;
            margin: 0 0 24px 0;
        }

        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .pin-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            color: #111827;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            letter-spacing: 6px;
            font-family: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .pin-input::placeholder {
            color: #9ca3af;
            letter-spacing: 4px;
        }

        .pin-input:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 10px 14px;
            margin-top: 18px;
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: inherit;
            color: #ffffff;
            background: #1d4ed8;
            border: 1px solid #1d4ed8;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .btn-login:hover {
            background: #1e40af;
            border-color: #1e40af;
        }

        .btn-login:active {
            background: #1e3a8a;
            border-color: #1e3a8a;
        }

        .btn-login:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.25);
        }

        .alert-error {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.8125rem;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .alert-error i {
            flex-shrink: 0;
            margin-top: 1px;
        }

        .footer-text {
            text-align: center;
            margin: 20px 0 0 0;
            color: #6b7280;
            font-size: 0.75rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }
            .login-card {
                padding: 28px 22px;
            }
            h1 {
                font-size: 1.125rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="brand-mark" aria-hidden="true">
                <i class="bi bi-building"></i>
            </div>

            <h1>Dashboard Data Pasar</h1>
            <p class="subtitle">Silakan masukkan PIN untuk melanjutkan.</p>

            {% if error %}
                <div class="alert-error" role="alert">
                    <i class="bi bi-exclamation-circle"></i>
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <form method="post" action="{% url 'dashboard:login' %}" novalidate>
                {% csrf_token %}

                <label class="form-label" for="pin">PIN Akses</label>
                <input
                    type="password"
                    id="pin"
                    name="pin"
                    class="pin-input"
                    placeholder="••••••"
                    autocomplete="off"
                    autofocus
                    required
                >

                <button type="submit" class="btn-login">Masuk</button>
            </form>

            <p class="footer-text">
                &copy; 2026 PT Pasar Surya Surabaya
            </p>
        </div>
    </div>
</body>
</html>
